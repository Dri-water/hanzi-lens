name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: packages/core/data/raw
          key: dict-raw-${{ hashFiles('packages/core/scripts/build-data.mjs') }}
      - run: npm ci
      - run: npm run data
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package extension
        run: |
          cd packages/extension/dist
          rm -f demo.html demo.js showcase.html
          zip -r ../../../hanzi-lens-chrome.zip .
          cd ../dist-firefox
          zip -r ../../../hanzi-lens-firefox.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: hanzi-lens-extension
          path: hanzi-lens-*.zip
